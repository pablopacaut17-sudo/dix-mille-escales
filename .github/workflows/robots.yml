name: Robots et publication

# Chaque nuit, plusieurs groupes de robots travaillent en parallèle (environ 5 h 30 maximum chacun),
# enregistrent leurs données dans des branches « donnees-… » (sans historique, pour que le dépôt ne grossisse pas),
# puis le site est regénéré et publié. Une modification des fichiers du site le republie aussitôt.

on:
  schedule:
    - cron: "30 0 * * *"     # chaque nuit à 0 h 30 (heure UTC)
  workflow_dispatch:          # bouton « Run workflow » pour lancer à la main
    inputs:
      groupes:
        description: "Groupes à lancer, séparés par des virgules (villes, base, climat, encyclopedie, lieux, guides, decouvertes, redaction, publier). Vide = tous."
        required: false
        default: ""
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

env:
  DME_DONNEES: ${{ github.workspace }}/donnees
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  villes:
    if: github.event_name != 'push' && (inputs.groupes == null || inputs.groupes == '' || contains(inputs.groupes, 'villes'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Liste des villes de 5 000 habitants et plus
        run: |
          pip install babel
          python3 robots/robot_villes.py
      - name: Enregistrer
        run: python3 robots/sauver.py --principal

  base:
    needs: villes
    if: ${{ !failure() && !cancelled() && github.event_name != 'push' && (inputs.groupes == null || inputs.groupes == '' || contains(inputs.groupes, 'base')) }}
    concurrency: { group: robots-base, cancel-in-progress: false }
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Réunir les données
        run: python3 robots/preparer.py
      - name: Change, jours fériés, sécurité, formalités, coût de la vie
        continue-on-error: true
        run: |
          python3 robots/robot_change.py || true
          python3 robots/robot_feries.py || true
          python3 robots/robot_securite.py || true
          python3 robots/robot_formalites.py || true
          python3 robots/robot_cout.py || true
          python3 robots/robot_aeroports.py || true
          python3 robots/robot_urgences.py || true
          python3 robots/robot_conseils.py || true
          python3 robots/robot_pratique.py || true
          python3 robots/robot_langues.py || true
          python3 robots/robot_avis.py || true
      - name: Météo et qualité de l'air
        continue-on-error: true
        run: python3 robots/robot_meteo.py
        env: { OPENMETEO_KEY: "${{ secrets.OPENMETEO_KEY }}" }
      - name: Enregistrer
        if: always()
        run: >
          python3 robots/sauver.py --branche donnees-base --chemins change.json feries securite.json formalites.json
          cout.json meteo aeroports.json.gz aeroports_meta.json journal/change.json journal/feries.json
          journal/securite.json journal/formalites.json journal/cout.json journal/meteo.json journal/aeroports.json
          urgences.json journal/urgences.json conseils journal/conseils.json pratique.json journal/pratique.json langues.json journal/langues.json avis.json journal/avis.json

  encyclopedie:
    needs: villes
    if: ${{ !failure() && !cancelled() && github.event_name != 'push' && (inputs.groupes == null || inputs.groupes == '' || contains(inputs.groupes, 'encyclopedie')) }}
    concurrency: { group: robots-encyclopedie, cancel-in-progress: false }
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Réunir les données
        run: python3 robots/preparer.py
      - name: Encyclopédie
        continue-on-error: true
        run: python3 robots/robot_encyclopedie.py --max-villes ${{ vars.MAX_ENCYCLO || 8000 }} --duree-max 290
      - name: Enregistrer
        if: always()
        run: python3 robots/sauver.py --branche donnees-encyclopedie --chemins encyclo journal/encyclopedie.json

  lieux:
    needs: villes
    if: ${{ !failure() && !cancelled() && github.event_name != 'push' && (inputs.groupes == null || inputs.groupes == '' || contains(inputs.groupes, 'lieux')) }}
    strategy:
      fail-fast: false
      matrix:
        part: [0, 1, 2, 3]
    concurrency: { group: "robots-lieux-${{ matrix.part }}", cancel-in-progress: false }
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Outils OpenStreetMap
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q osmium-tool
          pip install osmium
      - name: Réunir les données
        run: python3 robots/preparer.py
      - name: Lieux (robot ${{ matrix.part }}, fichiers OpenStreetMap régionaux)
        continue-on-error: true
        run: python3 robots/robot_osm.py --part ${{ matrix.part }} --parts 4 --duree-max 300
      - name: Enregistrer
        if: always()
        run: >
          python3 robots/sauver.py --branche donnees-lieux-${{ matrix.part }} --chemins lieux/${{ matrix.part }}
          lieux/osm-${{ matrix.part }} lieux/_suivi_${{ matrix.part }}.json lieux/_osm_suivi_${{ matrix.part }}.json
          journal/lieux_${{ matrix.part }}.json geofabrik_index.json diplomatie/osm-${{ matrix.part }}.json transports/osm-${{ matrix.part }}.json

  climat:
    needs: villes
    if: ${{ !failure() && !cancelled() && github.event_name != 'push' && (inputs.groupes == null || inputs.groupes == '' || contains(inputs.groupes, 'climat')) }}
    concurrency: { group: robots-climat, cancel-in-progress: false }
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Réunir les données
        run: python3 robots/preparer.py
      - name: Climat (NASA POWER)
        continue-on-error: true
        run: python3 robots/robot_climat.py --max-villes ${{ vars.MAX_CLIMAT || 8000 }} --duree-max 320
      - name: Enregistrer
        if: always()
        run: python3 robots/sauver.py --branche donnees-climat --chemins climat journal/climat.json

  guides:
    needs: villes
    if: ${{ !failure() && !cancelled() && github.event_name != 'push' && (inputs.groupes == null || inputs.groupes == '' || contains(inputs.groupes, 'guides') || contains(inputs.groupes, 'encyclopedie')) }}
    concurrency: { group: robots-guides, cancel-in-progress: false }
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Réunir les données
        run: python3 robots/preparer.py
      - name: Guides Wikivoyage
        continue-on-error: true
        run: python3 robots/robot_guides.py --max-villes ${{ vars.MAX_GUIDES || 15000 }} --duree-max 320
      - name: Enregistrer
        if: always()
        run: python3 robots/sauver.py --branche donnees-guides --chemins guides journal/guides.json

  histoires:
    needs: villes
    if: ${{ !failure() && !cancelled() && github.event_name != 'push' && (inputs.groupes == null || inputs.groupes == '' || contains(inputs.groupes, 'histoires')) }}
    concurrency: { group: robots-histoires, cancel-in-progress: false }
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Réunir les données
        run: python3 robots/preparer.py
      - name: Correction des dates avant Jésus-Christ (une seule fois)
        continue-on-error: true
        timeout-minutes: 50
        run: python3 robots/corriger_dates.py --duree-max 40
      - name: Histoire des lieux célèbres (Wikipédia)
        continue-on-error: true
        run: python3 robots/robot_histoires.py --duree-max 260
      - name: Enregistrer
        if: always()
        run: python3 robots/sauver.py --branche donnees-histoires --chemins histoires journal/histoires.json

  decouvertes:
    needs: villes
    if: ${{ !failure() && !cancelled() && github.event_name != 'push' && (inputs.groupes == null || inputs.groupes == '' || contains(inputs.groupes, 'decouvertes')) }}
    concurrency: { group: robots-decouvertes, cancel-in-progress: false }
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Réunir les données
        run: python3 robots/preparer.py
      - name: Réseaux de transport (Mobility Database)
        continue-on-error: true
        timeout-minutes: 30
        run: python3 robots/robot_reseaux.py
      - name: Offices de tourisme (DATAtourisme, France)
        continue-on-error: true
        timeout-minutes: 60
        run: python3 robots/robot_datatourisme.py
      - name: Fêtes et festivals (Wikidata)
        continue-on-error: true
        run: python3 robots/robot_fetes.py --max-villes ${{ vars.MAX_FETES || 20000 }} --duree-max 50
      - name: Noms français des villes (Wikidata)
        continue-on-error: true
        timeout-minutes: 50
        run: python3 robots/robot_noms.py --duree-max 40
      - name: Grands chiffres des lieux (Wikidata, chaque semaine)
        continue-on-error: true
        timeout-minutes: 75
        run: python3 robots/robot_chiffres.py --duree-max 60
      - name: Photos des villes (Wikimedia Commons)
        continue-on-error: true
        run: python3 robots/robot_photos.py --max-villes ${{ vars.MAX_PHOTOS || 4000 }} --duree-max 80
      - name: Enregistrer
        if: always()
        run: >
          python3 robots/sauver.py --branche donnees-decouvertes --chemins photos fetes reseaux.json datatourisme.json.gz chiffres.json.gz noms.json.gz
          journal/photos.json journal/fetes.json journal/reseaux.json journal/datatourisme.json journal/chiffres.json journal/noms.json

  redaction:
    needs: [base, encyclopedie, lieux, guides, climat, histoires]
    if: always() && !cancelled() && github.event_name != 'push' && (inputs.groupes == null || inputs.groupes == '' || contains(inputs.groupes, 'redaction'))
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Réunir les données
        run: python3 robots/preparer.py
      - name: Rédaction (si une clé API Claude est fournie)
        continue-on-error: true
        run: python3 robots/robot_redaction.py --max-villes ${{ vars.MAX_REDACTION || 80 }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
      - name: Enregistrer
        if: always()
        run: python3 robots/sauver.py --branche donnees-redaction --chemins redaction journal/redaction.json

  publier:
    needs: [villes, base, encyclopedie, lieux, guides, climat, histoires, decouvertes, redaction]
    if: always() && !cancelled()
    concurrency: { group: publication, cancel-in-progress: true }
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy2.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Réunir les données (et retirer de data/ les anciennes données déjà enregistrées ailleurs)
        run: python3 robots/preparer.py --nettoyer-main
      - name: Alléger le dépôt principal
        if: github.event_name != 'push'
        continue-on-error: true
        run: python3 robots/sauver.py --principal
      - name: Générer le site
        run: python3 build.py
        env:
          SITE_URL: ${{ vars.SITE_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Garder le dépôt actif (GitHub suspend les tâches programmées après 60 jours sans modification)
        if: github.event_name == 'schedule'
        continue-on-error: true
        run: |
          git config user.name "robot-dix-mille-escales"; git config user.email "robot-dix-mille-escales@users.noreply.github.com"
          git fetch -q origin main && git checkout -q -B main origin/main
          date -u +"Dernière publication automatique : %Y-%m-%d %H:%M UTC" > data/derniere_publication.txt
          git add data/derniere_publication.txt && git commit -qm "Publication du $(date -u +%F) [skip ci]" && git push -q origin main || true
      - name: Nouvel essai de mise en ligne (incident GitHub passager)
        if: steps.deploy.outcome == 'failure'
        run: sleep 60
      - id: deploy2
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
