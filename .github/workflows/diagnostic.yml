name: Diagnostic réseau

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Échantillons de sources
        run: |
          mkdir -p diag && cd diag
          curl -4 -sS -m 60 -o index-fra.json https://data.international.gc.ca/travel-voyage/index-alpha-fra.json || echo echec > index-fra.err
          curl -4 -sS -m 60 -o cta-cap-IN.json https://data.international.gc.ca/travel-voyage/cta-cap-IN.json || echo echec > cta.err
          curl -4 -sS -m 60 -o cta-cap-in.json https://data.international.gc.ca/travel-voyage/cta-cap-in.json || true
          ls -la
          git init -q && git checkout -q -b diagnostic && git -c user.name=r -c user.email=r@r add -A && git -c user.name=r -c user.email=r@r commit -qm diag
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" diagnostic:diagnostic
