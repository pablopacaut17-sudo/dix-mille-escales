name: Test rapide des robots Lieux

on:
  workflow_dispatch:
    inputs:
      region:
        description: "Région Geofabrik à tester (ex. portugal, luxembourg)"
        required: true
        default: "portugal"

permissions:
  contents: write

env:
  DME_DONNEES: ${{ github.workspace }}/donnees
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Outils OpenStreetMap
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q osmium-tool
          pip install osmium
      - name: Tester une région
        continue-on-error: true
        timeout-minutes: 45
        run: python3 robots/robot_osm.py --region ${{ inputs.region }} --part 9 2>&1 | tee test.log
      - name: Enregistrer le résultat
        if: always()
        run: |
          mkdir -p donnees/test && cp test.log donnees/test/ 2>/dev/null || true
          python3 robots/sauver.py --branche donnees-test --chemins test lieux/osm-9 journal/lieux_9.json
